<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroMart - Electronics Vendor</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>ElectroMart</h1>
            <nav>
                <a href="#products">Products</a>
                <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
                <a href="#orders">My Orders</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="products" class="products-section">
            <h2>Browse Products</h2>
            <div class="filters">
                <select id="category-filter">
                    <option value="">All Categories</option>
                </select>
                <select id="manufacturer-filter">
                    <option value="">All Manufacturers</option>
                </select>
                <input type="text" id="search-box" placeholder="Search products...">
                <button onclick="filterProducts()">Filter</button>
            </div>
            <div id="products-grid" class="products-grid">
                <!-- Products will be loaded here -->
            </div>
        </section>

        <section id="cart" class="cart-section" style="display: none;">
            <h2>Shopping Cart</h2>
            <div id="cart-items"></div>
            <div class="cart-total">
                <strong>Total: $<span id="cart-total">0.00</span></strong>
            </div>
            <button onclick="checkout()" class="checkout-btn">Proceed to Checkout</button>
        </section>

        <section id="checkout" class="checkout-section" style="display: none;">
            <h2>Checkout</h2>
            <form id="checkout-form">
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="customer-email" required>
                </div>
                <div class="form-group">
                    <label>First Name:</label>
                    <input type="text" id="customer-firstname" required>
                </div>
                <div class="form-group">
                    <label>Last Name:</label>
                    <input type="text" id="customer-lastname" required>
                </div>
                <div class="form-group">
                    <label>Phone:</label>
                    <input type="tel" id="customer-phone">
                </div>
                <div class="form-group">
                    <label>Shipping Address:</label>
                    <input type="text" id="shipping-address" required>
                </div>
                <div class="form-group">
                    <label>City:</label>
                    <input type="text" id="shipping-city" required>
                </div>
                <div class="form-group">
                    <label>State:</label>
                    <input type="text" id="shipping-state" required>
                </div>
                <div class="form-group">
                    <label>Zip Code:</label>
                    <input type="text" id="shipping-zip" required>
                </div>
                <div class="form-group">
                    <label>Credit Card Number:</label>
                    <input type="text" id="credit-card" required>
                </div>
                <div class="form-group">
                    <label>Expiry Date:</label>
                    <input type="date" id="card-expiry" required>
                </div>
                <div class="form-group">
                    <label>CVV:</label>
                    <input type="text" id="card-cvv" maxlength="4" required>
                </div>
                <button type="submit">Place Order</button>
            </form>
        </section>

        <section id="orders" class="orders-section" style="display: none;">
            <h2>My Orders</h2>
            <div class="form-group">
                <label>Enter Email to View Orders:</label>
                <input type="email" id="order-email" placeholder="your@email.com">
                <button onclick="loadOrders()">Load Orders</button>
            </div>
            <div id="orders-list"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 ElectroMart. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
